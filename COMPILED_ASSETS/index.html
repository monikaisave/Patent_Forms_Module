    <meta name="description" content="Visual Drag &amp; Drop Patent Form Builder with Dynamic Auto-Fetch API, USPTO/PCT/IPO Schema Engine, Conditional Show/Hide Rules, and Official PDF Print Generation." />

  </head>
  <body>
    <div id="root"></div>

    <script>
      // Floating Close PDF Button Observer
      (function() {
        function checkPdfModal() {
          const modalBackdrop = document.querySelector('.official-modal-backdrop, .official-paper-scroll-view, .office-use-box');
          let closeBtn = document.getElementById('floating-close-pdf-portal-btn');
          
          if (modalBackdrop) {
            if (!closeBtn) {
              closeBtn = document.createElement('button');
              closeBtn.id = 'floating-close-pdf-portal-btn';
              closeBtn.innerHTML = '✕ Close';
              closeBtn.style.cssText = `
                position: fixed !important;
                top: 82px !important;
                right: 32px !important;
                z-index: 2147483647 !important;
                background: #dc2626 !important;
                color: #ffffff !important;
                border: 2px solid #ffffff !important;
                border-radius: 8px !important;
                padding: 8px 20px !important;
                font-size: 14px !important;
                font-weight: 700 !important;
                font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif !important;
                cursor: pointer !important;
                box-shadow: 0 4px 16px rgba(0,0,0,0.6), 0 0 12px rgba(220,38,38,0.6) !important;
                display: flex !important;
                align-items: center !important;
                gap: 6px !important;
                transition: transform 0.15s ease, background 0.15s ease !important;
              `;
              closeBtn.onmouseenter = () => { closeBtn.style.transform = 'scale(1.04)'; closeBtn.style.background = '#b91c1c'; };
              closeBtn.onmouseleave = () => { closeBtn.style.transform = 'scale(1)'; closeBtn.style.background = '#dc2626'; };
              closeBtn.onclick = function() {
                const closeTarget = document.querySelector('.official-modal-topbar button, .official-modal-backdrop, [title="Close Preview"]');
                if (closeTarget) {
                  closeTarget.click();
                }
                window.dispatchEvent(new KeyboardEvent('keydown', { key: 'Escape', code: 'Escape', bubbles: true }));
                closeBtn.remove();
              };
              document.body.appendChild(closeBtn);
            }
          } else {
            if (closeBtn) {
              closeBtn.remove();
            }
          }
        }

        // Global Esc key listener
        window.addEventListener('keydown', function(e) {
          if (e.key === 'Escape') {
            const closeBtn = document.getElementById('floating-close-pdf-portal-btn');
            if (closeBtn) {
              closeBtn.click();
            }
          }
        });

        const observer = new MutationObserver(checkPdfModal);
        observer.observe(document.body, { childList: true, subtree: true });
      })();
    </script>
  </body>
